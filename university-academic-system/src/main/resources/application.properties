spring.application.name=university-academic-system

# ---------- PostgreSQL connection ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/university_academic_db
spring.datasource.username=postgres
# Put YOUR PostgreSQL password here (the one you chose when installing PostgreSQL),
# or set the environment variable DB_PASSWORD before running.
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- Hibernate / JPA ----------
# update = create the tables from the entities, keep existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
